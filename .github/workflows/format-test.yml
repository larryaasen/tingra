# Formatting, builds, and unit tests for the Tingra monorepo (see CLAUDE.md
# "Toolchain & CI"): the formatting check, warning-clean builds, and unit tests
# for every package and app. Tests use generators and mocks only — no camera,
# microphone, or TCC authorization is needed on runners.
#
# The toolchain is pinned to Xcode 27.2 (Swift 6.4.2), the toolchain floor. It
# is on the `xcode-27` arm64 image (macOS 27), which also carries 27.0 and
# 27.1 (its default), so DEVELOPER_DIR pins 27.2 explicitly rather than
# trusting the image's default. The pin names the image's `Xcode_27.2.app`
# symlink, which pointed at the 27.2 release candidate (27B48) when it was set
# and follows the release as the image updates (pinned 2026-11-07; 27.0 from
# 2026-10-03; until then, Xcode 26.6 on `macos-26`).
#
# The other workflows are integration.yml (streaming tests against the ingest
# simulator, on streaming/output changes rather than blocking every PR) and
# the three releases, run on demand: release-cli.yml, release-sdk.yml, and
# release-cameras.yml. This workflow is also `workflow_call`-able, and each
# release calls it as its pre-release gate so a release can only be cut from a
# green tree.
#
# Deferred job, tracked in docs/TODO.md "CI follow-ups": the API-diff job for
# TingraPlugInKit and TingraEventBus (needs their first tags).

name: Format & Test

on:
  # The paths-ignore lists name files no job here reads: documentation, the
  # release templates and scripts, the ingest simulator, and the other
  # workflows. A change touching only these runs nothing; one touching any
  # other file runs everything. The two lists are kept identical. A Markdown
  # file under packages/ or apps/ other than an agent-rules file is not
  # ignored, since it could be a test fixture.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "LICENSE"
      - "packaging/**"
      - "apps/ingest-simulator/**"
      - "scripts/integration-test.sh"
      - "scripts/release-*.sh"
      - "scripts/run-app.sh"
      - "scripts/sign-app.sh"
      - ".github/workflows/integration.yml"
      - ".github/workflows/release-*.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "LICENSE"
      - "packaging/**"
      - "apps/ingest-simulator/**"
      - "scripts/integration-test.sh"
      - "scripts/release-*.sh"
      - "scripts/run-app.sh"
      - "scripts/sign-app.sh"
      - ".github/workflows/integration.yml"
      - ".github/workflows/release-*.yml"
  # Called by release-cli.yml, release-sdk.yml, and release-cameras.yml as the
  # pre-release gate.
  workflow_call:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  format:
    name: Formatting
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: scripts/check-format.sh

  build-and-test:
    name: Build & test (${{ matrix.package }})
    runs-on: xcode-27
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/TingraEventBus
          - packages/TingraPlugInKit
          - packages/TingraUVC
          - packages/TingraHost
          - packages/TingraAudio
          - packages/TingraCapturePlugIns
          - packages/TingraGeneratorPlugIns
          - packages/TingraComposition
          - packages/TingraEffectPlugIns
          - packages/TingraOutputPlugIns
          - packages/TingraRecordingPlugIns
          - packages/TingraMediaPlugIns
          - packages/TingraMCP
          - apps/tingra-cli
    steps:
      - uses: actions/checkout@v7
      - name: Build (warning-clean, including tests)
        working-directory: ${{ matrix.package }}
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$RUNNER_TEMP/build.log"
          # Warning-clean per CLAUDE.md "Strict Compilation"; dependency
          # checkouts under .build/ are excluded from the check.
          if grep "warning:" "$RUNNER_TEMP/build.log" | grep -v "/.build/"; then
            echo "::error::swift build produced warnings (listed above)"
            exit 1
          fi
      - name: Test
        working-directory: ${{ matrix.package }}
        # Well past any package's run (seconds), short of the job's limit, so
        # a hang leaves time for the stacks below.
        timeout-minutes: 5
        # Under a pseudo-terminal the test output streams line by line; into
        # a pipe it is held until the process exits, so a hung run's log
        # showed nothing. `script` keeps the test run's exit status; stdin
        # from /dev/null because it needs a terminal-capable one.
        run: script -q /dev/null swift test --skip-build < /dev/null
      - name: Show where a stuck test run is waiting
        # A hung run prints nothing (its output is lost when it is killed),
        # and its test process outlives the step, so sample every thread of
        # what is still running to name the call it is stuck in.
        if: failure()
        run: |
          pids=$(pgrep -f 'swiftpm-testing|xctest|\.xctest' || true)
          if [ -z "$pids" ]; then
            echo "No test process is still running."
            exit 0
          fi
          for pid in $pids; do
            echo "::group::$(ps -o pid=,etime=,command= -p "$pid")"
            sample "$pid" 2 -mayDie -file "$RUNNER_TEMP/sample-$pid.txt" > /dev/null 2>&1 || true
            cat "$RUNNER_TEMP/sample-$pid.txt" 2>/dev/null || echo "sample could not read process $pid"
            echo "::endgroup::"
          done

  app:
    name: Build & test (apps/tingra-app)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The app is an Xcode project, not an SPM package, so it builds with
      # xcodebuild rather than joining the matrix above. CODE_SIGNING_ALLOWED=NO
      # because runners hold no certificate for the project's team; the app's
      # entitlements and hardened runtime are exercised by the release
      # packaging job, not here.
      - name: Build & test (warning-clean)
        working-directory: apps/tingra-app
        run: |
          set -o pipefail
          xcodebuild test \
            -project tingra-app.xcodeproj \
            -scheme tingra-app \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/app-build.log"
          # Warning-clean per CLAUDE.md "Strict Compilation". Three exclusions,
          # none of them our code: package checkouts under SourcePackages (the
          # matrix job above already builds each package warning-clean),
          # appintentsmetadataprocessor's note that the app declares no App
          # Intents, and the unsigned-build complaint about Apple's own
          # XCTAutomationSupport/XCUIAutomation binaries.
          if grep "warning:" "$RUNNER_TEMP/app-build.log" \
            | grep -v "SourcePackages" \
            | grep -v "appintentsmetadataprocessor" \
            | grep -v "Failed to parse executable"; then
            echo "::error::xcodebuild produced warnings (listed above)"
            exit 1
          fi

  cameras:
    name: Build (apps/tingra-cameras)
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Tingra Cameras is its own Xcode project (docs/RELEASE.md, Decision
      # C12). It has no test target: the logic worth testing, its presets and
      # parameters, lives in TingraHost and is tested in the matrix above. So
      # this job only builds, unsigned for the reason the app job gives, and
      # holds the build warning-clean so it stops relying on someone opening
      # Xcode. The signed Release archive is release-cameras.yml's.
      - name: Build (warning-clean)
        working-directory: apps/tingra-cameras
        run: |
          set -o pipefail
          xcodebuild build \
            -project tingra-cameras.xcodeproj \
            -scheme tingra-cameras \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/cameras-build.log"
          # Warning-clean per CLAUDE.md "Strict Compilation", with the app
          # job's exclusions that apply here: package checkouts under
          # SourcePackages, and appintentsmetadataprocessor's note that the
          # app declares no App Intents.
          if grep "warning:" "$RUNNER_TEMP/cameras-build.log" \
            | grep -v "SourcePackages" \
            | grep -v "appintentsmetadataprocessor"; then
            echo "::error::xcodebuild produced warnings (listed above)"
            exit 1
          fi
